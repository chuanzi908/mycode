<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>购物车</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f0f2f5; }
        .header { background: #667eea; color: white; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .nav { display: flex; gap: 20px; margin-top: 10px; }
        .nav a { color: white; text-decoration: none; padding: 8px 16px; border-radius: 4px; }
        .nav a:hover { background: rgba(255,255,255,0.2); }
        .cart-items { margin-top: 20px; }
        .cart-item { background: white; padding: 20px; margin-bottom: 15px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }
        .item-info { flex: 1; }
        .item-name { font-size: 18px; font-weight: bold; margin-bottom: 5px; }
        .item-price { color: #ff4757; font-size: 20px; font-weight: bold; }
        .quantity-control { display: flex; align-items: center; gap: 10px; }
        .quantity-control button { padding: 5px 15px; border: 1px solid #ddd; background: white; cursor: pointer; border-radius: 4px; }
        .quantity-control input { width: 60px; text-align: center; border: 1px solid #ddd; padding: 5px; border-radius: 4px; }
        .remove-btn { background: #ff4757; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; }
        .total-section { background: white; padding: 20px; border-radius: 8px; margin-top: 20px; text-align: right; }
        .total-price { font-size: 24px; color: #ff4757; font-weight: bold; }
        .checkout-btn { background: #667eea; color: white; border: none; padding: 12px 40px; border-radius: 4px; cursor: pointer; font-size: 16px; margin-top: 15px; }
        .hidden { display: none; }
    </style>
</head>
<body>
<div class="header">
    <div class="container">
        <h1>购物车</h1>
        <div class="nav">
            <a href="index.html">首页</a>
            <a href="Order.html">购物车</a>
            <a href="orders.html">我的订单</a>
            <a href="#" id="logoutLink" onclick="logout()">退出登录</a>
        </div>
    </div>
</div>

<div class="container">
    <div id="cartItems" class="cart-items"></div>
    <div class="total-section">
        <div>总计: <span class="total-price" id="totalPrice">￥0.00</span></div>
        <button class="checkout-btn" onclick="checkout()">结算</button>
    </div>
</div>

<script>
    var cart = JSON.parse(localStorage.getItem('cart') || '[]');

    window.onload = function() {
        if (cart.length === 0) {
            document.getElementById('cartItems').innerHTML = '<p style="text-align:center;padding:40px;">购物车为空</p>';
            return;
        }
        displayCart();
    };

    function displayCart() {
        var container = document.getElementById('cartItems');
        container.innerHTML = '';
        var total = 0;

        cart.forEach(function(item, index) {
            var subtotal = item.price * item.quantity;
            total += subtotal;

            var html = '<div class="cart-item">' +
                '<div class="item-info">' +
                '<div class="item-name">' + item.name + '</div>' +
                '<div class="item-price">￥' + item.price.toFixed(2) + '</div>' +
                '</div>' +
                '<div class="quantity-control">' +
                '<button onclick="changeQuantity(' + index + ', -1)">-</button>' +
                '<input type="text" value="' + item.quantity + '" readonly>' +
                '<button onclick="changeQuantity(' + index + ', 1)">+</button>' +
                '</div>' +
                '<div style="font-weight:bold;margin:0 20px;">小计: ￥' + subtotal.toFixed(2) + '</div>' +
                '<button class="remove-btn" onclick="removeItem(' + index + ')">删除</button>' +
                '</div>';
            container.innerHTML += html;
        });

        document.getElementById('totalPrice').textContent = '￥' + total.toFixed(2);
    }

    function changeQuantity(index, delta) {
        cart[index].quantity += delta;
        if (cart[index].quantity < 1) cart[index].quantity = 1;
        localStorage.setItem('cart', JSON.stringify(cart));
        displayCart();
    }

    function removeItem(index) {
        cart.splice(index, 1);
        localStorage.setItem('cart', JSON.stringify(cart));
        displayCart();
        if (cart.length === 0) {
            document.getElementById('cartItems').innerHTML = '<p style="text-align:center;padding:40px;">购物车为空</p>';
        }
    }

    function checkout() {
        if (cart.length === 0) {
            alert('购物车为空');
            return;
        }

        var receiverName = prompt('请输入收货人姓名:');
        if (!receiverName) return;

        var receiverPhone = prompt('请输入联系电话:');
        if (!receiverPhone) return;

        var receiverAddress = prompt('请输入收货地址:');
        if (!receiverAddress) return;

        var productIds = cart.map(function(item) { return item.id; }).join(',');
        var quantities = cart.map(function(item) { return item.quantity; }).join(',');

        var formData = new FormData();
        formData.append('productIds', productIds);
        formData.append('quantities', quantities);
        formData.append('receiverName', receiverName);
        formData.append('receiverPhone', receiverPhone);
        formData.append('receiverAddress', receiverAddress);

        fetch('order/create', {
            method: 'POST',
            body: formData
        })
        .then(function(res) { return res.json(); })
        .then(function(data) {
            if (data.success) {
                alert('下单成功！订单号: ' + data.orderNo);
                localStorage.removeItem('cart');
                window.location.href = 'orders.html';
            } else {
                alert(data.message);
            }
        });
    }

    function logout() {
        localStorage.removeItem('cart');
        fetch('user/logout', { method: 'POST' })
            .then(function() { location.reload(); });
    }
</script>
</body>
</html>
