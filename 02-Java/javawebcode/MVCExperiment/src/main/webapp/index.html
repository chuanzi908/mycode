<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Shopping Mall</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f5f5f5; }
        .header { background: #667eea; color: white; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .header-content { display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 24px; font-weight: bold; }
        .nav { display: flex; gap: 20px; align-items: center; }
        .nav a { color: white; text-decoration: none; padding: 8px 16px; border-radius: 4px; }
        .nav a:hover { background: rgba(255,255,255,0.2); }
        .user-info { display: flex; align-items: center; gap: 15px; }
        .username { font-weight: bold; }
        .products { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; margin-top: 20px; }
        .product-card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); transition: transform 0.3s; }
        .product-card:hover { transform: translateY(-5px); }
        .product-name { font-size: 18px; font-weight: bold; margin-bottom: 10px; color: #333; }
        .product-desc { color: #666; font-size: 14px; margin-bottom: 10px; }
        .product-price { color: #e74c3c; font-size: 20px; font-weight: bold; margin-bottom: 10px; }
        .product-stock { color: #999; font-size: 12px; margin-bottom: 15px; }
        .btn { background: #667eea; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; width: 100%; }
        .btn:hover { background: #5568d3; }
        .loading { text-align: center; padding: 40px; color: #999; }
        .empty { text-align: center; padding: 40px; color: #999; }
    </style>
</head>
<body>
    <div class="header">
        <div class="container">
            <div class="header-content">
                <div class="logo">Shopping Mall</div>
                <div class="nav" id="nav-menu">
                    <a href="index.html">Home</a>
                    <a href="Order.html">Orders</a>
                    <div id="auth-links">
                        <a href="login.html">Login</a>
                        <a href="register.html">Register</a>
                    </div>
                    <div id="user-links" style="display: none;" class="user-info">
                        <span class="username" id="current-username"></span>
                        <a href="#" onclick="showProfile()">Profile</a>
                        <a href="#" onclick="logout()">Logout</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="container">
        <h2 style="margin: 20px 0;">Product List</h2>
        <div id="products" class="products">
            <div class="loading">Loading...</div>
        </div>
    </div>

    <script>
        function checkLoginStatus() {
            fetch('user/check')
                .then(response => response.json())
                .then(data => {
                    if (data.loggedIn) {
                        document.getElementById('auth-links').style.display = 'none';
                        document.getElementById('user-links').style.display = 'flex';
                        document.getElementById('current-username').textContent = 'Hi, ' + data.username;
                    } else {
                        document.getElementById('auth-links').style.display = 'flex';
                        document.getElementById('user-links').style.display = 'none';
                    }
                })
                .catch(error => {
                    console.error('Error checking login status:', error);
                });
        }

        function logout() {
            fetch('user/logout', { method: 'POST' })
                .then(response => response.json())
                .then(data => {
                    alert('Logged out successfully');
                    window.location.reload();
                })
                .catch(error => {
                    console.error('Error:', error);
                });
        }

        function showProfile() {
            window.location.href = 'profile.html';
        }

        checkLoginStatus();

        fetch('product/list')
            .then(response => response.json())
            .then(products => {
                const container = document.getElementById('products');

                if (!products || products.length === 0) {
                    container.innerHTML = '<div class="empty">No products available</div>';
                    return;
                }

                container.innerHTML = products.map(product => `
                    <div class="product-card">
                        <div class="product-name">${product.name}</div>
                        <div class="product-desc">${product.description || 'No description'}</div>
                        <div class="product-price">$${product.price}</div>
                        <div class="product-stock">Stock: ${product.stock || 0}</div>
                        <button class="btn" onclick="alert('Added to cart')">Add to Cart</button>
                    </div>
                `).join('');
            })
            .catch(error => {
                console.error('Error:', error);
                document.getElementById('products').innerHTML =
                    '<div class="empty">Failed to load products</div>';
            });
    </script>
</body>
</html>
