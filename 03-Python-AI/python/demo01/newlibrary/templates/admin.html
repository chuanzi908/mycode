<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图书借阅系统 - 管理员</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #667eea;
        }
        .header h1 {
            color: #667eea;
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .btn {
            padding: 8px 16px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }
        .btn:hover {
            background: #5a67d8;
        }
        .btn-secondary {
            background: #6c757d;
        }
        .btn-danger {
            background: #dc3545;
        }
        .nav-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 1px solid #dee2e6;
            padding-bottom: 10px;
        }
        .tab-btn {
            padding: 10px 20px;
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            border-bottom: none;
            border-radius: 5px 5px 0 0;
            cursor: pointer;
        }
        .tab-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        .message {
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: none;
        }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background: #f8f9fa;
            font-weight: bold;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-control {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 10px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 图书借阅系统 - 管理员后台</h1>
            <div class="user-info">
                <span>管理员：<strong id="current-user">加载中...</strong></span>
                <a href="/" class="btn">返回首页</a>
                <button class="btn btn-secondary" onclick="logout()">退出登录</button>
            </div>
        </div>

        <div id="message" class="message"></div>

        <div class="nav-tabs">
            <button class="tab-btn active" onclick="switchTab('users')">用户管理</button>
            <button class="tab-btn" onclick="switchTab('add-user')">添加用户</button>
        </div>

        <!-- 用户管理 -->
        <div id="users-tab" class="tab-content active">
            <h2>用户列表</h2>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>用户名</th>
                            <th>邮箱</th>
                            <th>手机号</th>
                            <th>用户类型</th>
                            <th>注册时间</th>
                            <th>最后登录</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="users-body">
                        <tr><td colspan="8" style="text-align: center;"><div class="loading"></div> 加载中...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- 添加用户 -->
        <div id="add-user-tab" class="tab-content">
            <h2>添加新用户</h2>
            <form id="add-user-form">
                <div class="form-group">
                    <label>用户名：</label>
                    <input type="text" id="add-username" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>密码：</label>
                    <input type="password" id="add-password" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>邮箱：</label>
                    <input type="email" id="add-email" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>手机号：</label>
                    <input type="tel" id="add-phone" class="form-control">
                </div>
                <div class="form-group">
                    <label>用户类型：</label>
                    <select id="add-user-type" class="form-control">
                        <option value="member">普通会员</option>
                        <option value="admin">管理员</option>
                    </select>
                </div>
                <button type="submit" class="btn">添加用户</button>
            </form>
        </div>
    </div>

    <script>
        let currentUser = null;

        // 检查登录状态
        async function checkAdmin() {
            try {
                const response = await fetch('/api/current-user');
                const data = await response.json();

                if (!data.success || data.data.user_type !== 'admin') {
                    window.location.href = '/login';
                    return;
                }

                currentUser = data.data;
                document.getElementById('current-user').textContent = currentUser.username;
                loadUsers();
            } catch (error) {
                window.location.href = '/login';
            }
        }

        // 切换标签页
        function switchTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

            document.querySelector(`.tab-btn:nth-child(${tabName === 'users' ? 1 : 2})`).classList.add('active');
            document.getElementById(`${tabName}-tab`).classList.add('active');
        }

        // 显示消息
        function showMessage(type, text) {
            const messageEl = document.getElementById('message');
            messageEl.className = `message ${type}`;
            messageEl.textContent = text;
            messageEl.style.display = 'block';
            setTimeout(() => { messageEl.style.display = 'none'; }, 3000);
        }

        // 加载用户列表
        async function loadUsers() {
            try {
                const response = await fetch('/api/admin/users');
                const data = await response.json();

                if (data.success) {
                    const tbody = document.getElementById('users-body');
                    tbody.innerHTML = '';

                    data.data.forEach(user => {
                        const row = document.createElement('tr');
                        row.innerHTML = `
                            <td>${user.user_id}</td>
                            <td>${user.username}</td>
                            <td>${user.email}</td>
                            <td>${user.phone || '-'}</td>
                            <td>${user.user_type === 'admin' ? '管理员' : '会员'}</td>
                            <td>${new Date(user.created_at).toLocaleString()}</td>
                            <td>${user.last_login ? new Date(user.last_login).toLocaleString() : '-'}</td>
                            <td>
                                ${user.user_id !== currentUser.user_id ?
                                    `<button class="btn btn-danger" onclick="deleteUser(${user.user_id})">删除</button>` :
                                    '<span>当前用户</span>'}
                            </td>
                        `;
                        tbody.appendChild(row);
                    });
                } else {
                    showMessage('error', data.message);
                }
            } catch (error) {
                showMessage('error', '加载失败');
            }
        }

        // 删除用户
        async function deleteUser(userId) {
            if (!confirm('确定要删除这个用户吗？此操作不可恢复！')) {
                return;
            }

            try {
                const response = await fetch(`/api/admin/users/${userId}`, {
                    method: 'DELETE'
                });
                const data = await response.json();

                if (data.success) {
                    showMessage('success', '用户删除成功');
                    loadUsers();
                } else {
                    showMessage('error', data.message);
                }
            } catch (error) {
                showMessage('error', '删除失败');
            }
        }

        // 添加用户
        document.getElementById('add-user-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const username = document.getElementById('add-username').value;
            const password = document.getElementById('add-password').value;
            const email = document.getElementById('add-email').value;
            const phone = document.getElementById('add-phone').value;
            const userType = document.getElementById('add-user-type').value;

            if (!username || !password || !email) {
                showMessage('error', '请填写完整信息');
                return;
            }

            const btn = e.target.querySelector('button');
            btn.disabled = true;
            btn.textContent = '添加中...';

            try {
                const response = await fetch('/api/admin/users', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password, email, phone, user_type: userType })
                });
                const data = await response.json();

                if (data.success) {
                    showMessage('success', '用户添加成功');
                    e.target.reset();
                    loadUsers();
                    switchTab('users');
                } else {
                    showMessage('error', data.message);
                }
            } catch (error) {
                showMessage('error', '添加失败');
            } finally {
                btn.disabled = false;
                btn.textContent = '添加用户';
            }
        });

        // 退出登录
        async function logout() {
            try {
                const response = await fetch('/api/logout', { method: 'POST' });
                const data = await response.json();
                if (data.success) {
                    window.location.href = '/login';
                }
            } catch (error) {
                window.location.href = '/login';
            }
        }

        // 页面加载
        document.addEventListener('DOMContentLoaded', checkAdmin);
    </script>
</body>
</html>
