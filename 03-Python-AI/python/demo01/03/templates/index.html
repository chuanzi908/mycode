<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>文津阁图书借阅系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-primary mb-4">
  <div class="container-fluid">
    <span class="navbar-brand mb-0 h1">📚 文津阁图书借阅系统</span>
    <a href="/records" class="btn btn-light btn-sm">借阅记录</a>
  </div>
</nav>

<div class="container">
    <div class="card shadow-sm">
        <div class="card-header fw-bold">图书列表</div>
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead class="table-light">
                <tr>
                    <th>书名</th>
                    <th>作者</th>
                    <th>可借数量</th>
                    <th>操作</th>
                </tr>
                </thead>
                <tbody>
                {% for book in books %}
                <tr>
                    <td>{{ book.title }}</td>
                    <td>{{ book.author }}</td>
                    <td>
                        {% if book.available_copies > 0 %}
                        <span class="badge bg-success">{{ book.available_copies }}</span>
                        {% else %}
                        <span class="badge bg-danger">无库存</span>
                        {% endif %}
                    </td>
                    <td>
                        <button class="btn btn-sm btn-primary"
                                {% if book.available_copies <= 0 %}disabled{% endif %}
                                onclick="borrow({{ book.id }})">
                            借书
                        </button>
                    </td>
                </tr>
                {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
function borrow(bookId) {
    if (!confirm('确认借阅该图书？')) return;

    const today = new Date();
    today.setDate(today.getDate() + 30);
    const dueDate = today.toISOString().split('T')[0];

    fetch('/borrow', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
            book_id: bookId,
            member_id: 1,
            due_date: dueDate
        })
    })
    .then(r => r.json())
    .then(d => {
        alert(d.success ? '借书成功' : d.msg);
        location.reload();
    });
}
</script>

</body>
</html>
