<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>借阅记录</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-secondary mb-4">
  <div class="container-fluid">
    <span class="navbar-brand">📄 借阅记录</span>
    <a href="/" class="btn btn-light btn-sm">返回首页</a>
  </div>
</nav>

<div class="container">
    <div class="card shadow-sm">
        <div class="card-header fw-bold">全部借阅记录</div>
        <div class="card-body p-0">
            <table class="table table-striped mb-0">
                <thead class="table-light">
                <tr>
                    <th>读者</th>
                    <th>书名</th>
                    <th>借阅日期</th>
                    <th>应还日期</th>
                    <th>归还日期</th>
                    <th>状态</th>
                </tr>
                </thead>
                <tbody>
                {% for r in records %}
                <tr>
                    <td>{{ r.name }}</td>
                    <td>{{ r.title }}</td>
                    <td>{{ r.borrow_date }}</td>
                    <td>{{ r.due_date }}</td>
                    <td>{{ r.return_date or '-' }}</td>
                    <td>
                        {% if r.status == '借阅中' %}
                        <span class="badge bg-primary">借阅中</span>
                        {% elif r.status == '已归还' %}
                        <span class="badge bg-success">已归还</span>
                        {% else %}
                        <span class="badge bg-danger">逾期</span>
                        {% endif %}
                    </td>
                </tr>
                {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>

</body>
</html>
